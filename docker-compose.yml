version: '3.8'

services:
  db:
    image: postgres:15
    container_name: aurik_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aurik
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: aurik_api
    ports:
      - "8000:8000"
    environment:
      # Internal Docker network connection
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/aurik
    depends_on:
      - db

volumes:
  postgres_data:
